<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
}

/* Sidebar */
.sidebar{
    height:100vh;
    background:#111;
    color:white;
    padding-top:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px 20px;
}

.sidebar a:hover{
    background:#333;
}

/* Cards */
.card-box{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* Chart Box */
.chart-box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-2 sidebar">
    <h4 class="text-center">ADMIN</h4>

    <a href="#">Dashboard</a>
    <a href="#">Analytics</a>
    <a href="#">Orders</a>
    <a href="#">Customers</a>
</div>

<!-- Main Content -->
<div class="col-md-10 p-4">

<h2 class="mb-4">Dashboard Analytics</h2>

<!-- Statistics -->
<div class="row g-3">

<div class="col-md-3">
<div class="card-box">
    <h6>Total Revenue</h6>
    <h3>₹8,45,000</h3>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
    <h6>Orders</h6>
    <h3>1284</h3>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
    <h6>Customers</h6>
    <h3>3120</h3>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
    <h6>Products</h6>
    <h3>46</h3>
</div>
</div>

</div>

<!-- Analytics Chart -->
<div class="row mt-4">

<div class="col-md-8">
<div class="chart-box">

<h5>Sales Analytics</h5>

<canvas id="salesChart"></canvas>

</div>
</div>

<div class="col-md-4">
<div class="chart-box">

<h5>Category Stats</h5>

<canvas id="pieChart"></canvas>

</div>
</div>

</div>

</div>
</div>
</div>

<script>

/* Line Chart */
new Chart(document.getElementById("salesChart"),{
type:'line',

data:{
labels:['Jan','Feb','Mar','Apr','May','Jun'],

datasets:[{
label:'Sales',
data:[12,19,10,25,22,30],
borderColor:'blue',
backgroundColor:'rgba(0,0,255,0.1)',
fill:true,
tension:0.4
}]
}

});

/* Pie Chart */
new Chart(document.getElementById("pieChart"),{
type:'doughnut',

data:{
labels:['Electronics','Fashion','Sports'],

datasets:[{
data:[40,35,25],
backgroundColor:['red','blue','green']
}]
}

});

</script>

</body>
</html>
