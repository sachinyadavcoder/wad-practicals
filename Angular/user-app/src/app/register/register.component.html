<div class="container">

    <h2>Register User</h2>

    <br>

    <input
        type="text"
        placeholder="Enter Name"
        [(ngModel)]="name">

    <br><br>

    <input
        type="email"
        placeholder="Enter Email"
        [(ngModel)]="email">

    <br><br>

    <input
        type="password"
        placeholder="Enter Password"
        [(ngModel)]="password">

    <br><br>

    <button (click)="registerUser()">

        Register

    </button>

</div>
