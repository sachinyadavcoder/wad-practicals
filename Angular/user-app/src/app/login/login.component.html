<div class="container">

    <h2>Login User</h2>

    <br>

    <input
        type="email"
        placeholder="Enter Email"
        [(ngModel)]="email">

    <br><br>

    <input
        type="password"
        placeholder="Enter Password"
        [(ngModel)]="password">

    <br><br>

    <button (click)="loginUser()">

        Login

    </button>

</div>
